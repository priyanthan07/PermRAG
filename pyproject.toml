[project]
name = "permrag"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "authzed>=1.25.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "httpx>=0.28.1",
    "langfuse>=4.15.1",
    "mypy>=2.3.1",
    "openai>=3.8.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.13.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.0",
    "ruff>=0.16.6",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/permrag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


