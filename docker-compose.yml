name: permrag

services:
  postgres:
    image: postgres:16-alpine
    container_name: permrag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-permrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-permrag}
      POSTGRES_DB: ${POSTGRES_DB:-permrag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-permrag} -d ${POSTGRES_DB:-permrag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies SpiceDB's own table migrations, then exits. SpiceDB refuses
  # to start against an unmigrated datastore, so this must succeed first.
  spicedb-migrate:
    image: authzed/spicedb:v1.35.3
    container_name: permrag-spicedb-migrate
    command:
      - migrate
      - head
      - --datastore-engine=postgres
      - --datastore-conn-uri=postgres://${POSTGRES_USER:-permrag}:${POSTGRES_PASSWORD:-permrag}@postgres:5432/${SPICEDB_DB:-spicedb}?sslmode=disable

    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  spicedb:
    image: authzed/spicedb:v1.35.3
    container_name: permrag-spicedb
    restart: unless-stopped
    command:
      - serve
      - --grpc-preshared-key=${SPICEDB_TOKEN:-permrag-local-dev-key}
      - --datastore-engine=postgres
      - --datastore-conn-uri=postgres://${POSTGRES_USER:-permrag}:${POSTGRES_PASSWORD:-permrag}@postgres:5432/${SPICEDB_DB:-spicedb}?sslmode=disable
      - --http-enabled
    ports:
      - "${SPICEDB_GRPC_PORT:-50051}:50051"
      - "${SPICEDB_HTTP_PORT:-8443}:8443"
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully
    
  qdrant:
    image: qdrant/qdrant:v1.13.1
    container_name: permrag-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
  
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: permrag-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      SPICEDB_ENDPOINT: spicedb:50051
      QDRANT_URL: http://qdrant:6333
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      spicedb:
        condition: service_started
      qdrant:
        condition: service_started
    profiles: ["full"]
    
volumes:
  postgres_data:
  qdrant_data:
