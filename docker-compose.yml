name: permrag

services:
  # Applies SpiceDB's own table migrations, then exits. SpiceDB refuses
  # to start against an unmigrated datastore, so this must succeed first.
  spicedb-migrate:
    image: authzed/spicedb:v1.35.3
    container_name: permrag-spicedb-migrate
    command:
      - migrate
      - head
      - --datastore-engine=postgres
      - --datastore-conn-uri=postgres://${SPICEDB_POSTGRES_USER:-permrag}:${SPICEDB_POSTGRES_PASSWORD:-permrag}@${SPICEDB_POSTGRES_HOST:-localhost}:${SPICEDB_POSTGRES_PORT:-5432}/${SPICEDB_DB:-spicedb}?sslmode=${POSTGRES_SSL_MODE:-disable}
    restart: on-failure

  spicedb:
    image: authzed/spicedb:v1.35.3
    container_name: permrag-spicedb
    restart: unless-stopped
    command:
      - serve
      - --grpc-preshared-key=${SPICEDB_TOKEN:-permrag-local-dev-key}
      - --datastore-engine=postgres
      - --datastore-conn-uri=postgres://${SPICEDB_POSTGRES_USER:-permrag}:${SPICEDB_POSTGRES_PASSWORD:-permrag}@${SPICEDB_POSTGRES_HOST:-localhost}:${SPICEDB_POSTGRES_PORT:-5432}/${SPICEDB_DB:-spicedb}?sslmode=${POSTGRES_SSL_MODE:-disable}
      - --http-enabled
    # Loopback only: the preshared key has a well-known default, so the
    # permission graph must not be reachable from the rest of the network.
    ports:
      - "127.0.0.1:${SPICEDB_GRPC_PORT:-50051}:50051"
      - "127.0.0.1:${SPICEDB_HTTP_PORT:-8443}:8443"
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully
    
  qdrant:
    image: qdrant/qdrant:v1.13.1
    container_name: permrag-qdrant
    restart: unless-stopped
    # Loopback only: plain HTTP, and the API key may be empty.
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
  
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: permrag-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPICEDB_ENDPOINT: spicedb:50051
      QDRANT_URL: http://qdrant:6333
      # .env points at localhost for running on the host; inside this
      # container localhost is the container itself.
      POSTGRES_HOST: ${API_POSTGRES_HOST:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Migrations first, so a fresh or upgraded database is never served.
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn permrag.api.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      # Reranker model and tokenizer, downloaded once instead of every start.
      - hf_cache:/home/permrag/.cache/huggingface
    # Loopback only: the UI reaches the API over the compose network; the
    # host port is for local tools. Put a TLS reverse proxy in front before
    # exposing either service beyond this machine.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      spicedb:
        condition: service_started
      qdrant:
        condition: service_started
    profiles: ["full"]

  # Streamlit console. Calls the API server-side at http://api:8000, so the
  # browser only ever talks to this service.
  ui:
    build:
      context: .
      dockerfile: ui.Dockerfile
    container_name: permrag-ui
    restart: unless-stopped
    environment:
      PERMRAG_API_URL: http://api:8000
    ports:
      - "${UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    profiles: ["full"]

volumes:
  qdrant_data:
  hf_cache:
